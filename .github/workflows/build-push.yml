# Builds the self-contained Strata image (the C++/CUDA engine is compiled inside
# the build) and pushes it to the GitHub Container Registry, where GPUStack pulls
# it from. The tag is fixed to the release this package was cut from, and the image
# name is the lowercase form of the "Niko1221-Strata" package name that
# deploy/backend.yaml names. No GPU is needed at build time; the host needs one
# at run time.
name: Build and push the GPUStack image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: zhangyi1976/niko1221-strata
  VERSION: "0.1.40"

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The engine is compiled for every listed CUDA architecture into one fat
      # binary, so a card on any of them runs the image without a rebuild.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:v${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            CUDA_ARCHITECTURES=75;80;86;89;120
            BUILD_VISION=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
